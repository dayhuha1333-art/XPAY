buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/maven' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '3.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version = '1.0'
group = 'com.example.xray'
archivesBaseName = 'xray'

minecraft {
    mappings channel: 'stable', version: '39-1.12'
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg "-mixin.config=mixins.xray.json"
        }
    }
}

repositories {
    maven { url = 'https://repo.spongepowered.org/maven' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
}

mixin {
    add sourceSets.main, "mixins.xray.refmap.json"
}

jar {
    manifest {
        attributes([
            "Specification-Title": "xray",
            "Specification-Vendor": "you",
            "Specification-Version": "1",
            "Implementation-Title": "xray",
            "Implementation-Version": "1.0",
            "Implementation-Vendor": "you",
            "MixinConfigs": "mixins.xray.json"
        ])
    }
}
